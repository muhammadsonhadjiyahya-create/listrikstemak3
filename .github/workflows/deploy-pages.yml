name: Publikasikan SAFETY LAB TITL
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil file website
        uses: actions/checkout@v4
      - name: Aktifkan dan siapkan GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Kemas website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
